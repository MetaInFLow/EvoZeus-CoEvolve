name: CI

on:
  pull_request:
  push:
    branches: [main, "uat/current"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical closure tests compare frozen artifacts with their exact
          # construction revisions, so the verifier needs those commits locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest pydantic pyyaml
      - run: python -m pytest -q
      - name: Verify immutable Harness history and release bindings
        run: python scripts/evozeus_official_upgrade_verify.py verify-base --repo-root .
      - run: python -m py_compile scripts/evozeus_wrapper.py scripts/evozeus_wrapper_bootstrap.py scripts/evozeus_wrapper_global_hook.py scripts/evozeus_wrapper_lifecycle.py scripts/evozeus_wrapper_preflight.py
