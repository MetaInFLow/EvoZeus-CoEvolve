name: Release archive

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_NOTES_DIR: docs/releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag
        run: test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"
      - name: Verify release notes
        run: test -s "${RELEASE_NOTES_DIR}/${GITHUB_REF_NAME}.md"
      - name: Verify repository
        run: |
          python -m pip install --upgrade pip pytest pydantic pyyaml
          python -m pytest -q
      - name: Build immutable source archive
        run: |
          git archive --format=tar.gz --prefix="EvoZeus-CoEvolve-${GITHUB_REF_NAME}/" -o "evozeus-coevolve-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          shasum -a 256 "evozeus-coevolve-${GITHUB_REF_NAME}.tar.gz" > "evozeus-coevolve-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "EvoZeus-CoEvolve ${GITHUB_REF_NAME}" --notes-file "${RELEASE_NOTES_DIR}/${GITHUB_REF_NAME}.md"
          gh release upload "${GITHUB_REF_NAME}" "evozeus-coevolve-${GITHUB_REF_NAME}.tar.gz" "evozeus-coevolve-${GITHUB_REF_NAME}.tar.gz.sha256" --clobber
